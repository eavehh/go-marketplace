# docker compose -p marketplase_dev -f compose-dev.yaml up -d

# docker compose -p marketplase_dev -f compose-dev.yaml down -v

# migrate -path migrations/catalog -database "postgres://postgres:12345678@localhost:9101/catalog_db_dev?sslmode=disable" ...

services:
  catalog_db_dev:
    container_name: "catalog_db_dev"
    image: "postgres:18.1"
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=123456789
    - POSTGRES_DB=catalog_db_dev
    restart: always
    ports:
      - "9101:5432"
    volumes:
      - postgres_catalog_dev:/var/lib/postgresql
    networks:
      - marketplace-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  basket_db_dev:
    container_name: "basket_db_dev"
    image: "postgres:18.1"
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=123456789
    - POSTGRES_DB=basket_db_dev
    restart: always
    ports:
      - "9102:5432"
    volumes:
      - postgres_basket_dev:/var/lib/postgresql
    networks:
      - marketplace-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  basket_cache_redis_dev:
    container_name: basket-redis-dev
    image: redis:7
    command: redis-server --requirepass "123456789" --protected-mode no
    restart: always
    ports:
      - "9112:6379"
    volumes:
      - redis_basket_dev:/data
    networks:
      - marketplace-dev-net


volumes:
    postgres_catalog_dev:
    postgres_basket_dev:
    redis_basket_dev:

networks: 
  marketplace-dev-net:
    driver: bridge