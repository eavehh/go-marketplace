# docker compose -p marketplase_dev -f compose_dev.yaml up -d

# docker compose -p marketplase_dev -f compose_dev.yaml down -v

# migrate -path migrations/catalog -database "postgres://postgres:12345678@localhost:9101/catalog_db_dev?sslmode=disable" ...

services:
  catalog_db_dev:
    container_name: "catalog_db_dev"
    image: "postgres:18.1"
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=123456789
    - POSTGRES_DB=catalog_db_dev
    restart: always
    ports:
      - "9101:5432"
    volumes:
      - postgres_catalog_dev:/var/lib/postgresql
    networks:
      - catalog_dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
    postgres_catalog_dev:

networks: 
  catalog_dev_net:
    driver: bridge